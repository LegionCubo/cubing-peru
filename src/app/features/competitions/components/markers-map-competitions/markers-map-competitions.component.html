<competitions-form-list (formSended)="formSended($event)" [isFormMap]="true"></competitions-form-list>

<div class="table_conteiner">
  <table mat-table
         [dataSource]="dataSource()" multiTemplateDataRows
         class="table mat-elevation-z8">
  
    <ng-container matColumnDef="ubicar">
      <th mat-header-cell *matHeaderCellDef  >UBICAR</th>
      <td mat-cell *matCellDef="let element">
        <button
          matIconButton
          aria-label="expand row"
          (click)="markerCompetition(element.id, element.latitude, element.longitude)"
          class="example-toggle-button">
          <mat-icon [style.color]="competitionMarker()!=element.id?'white':'var(--primary-color)'">place</mat-icon>
        </button>
      </td>
    </ng-container>
  
      <ng-container matColumnDef="competitionDate">
        <th mat-header-cell *matHeaderCellDef>FECHA</th>
        <td mat-cell *matCellDef="let element">{{ element.competitionDate | rangeDate: element.competitionEndDate }}</td>
      </ng-container>
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>NOMBRE</th>
        <td mat-cell *matCellDef="let element" class="name-competition">
          <a [href]="'https://www.worldcubeassociation.org/competitions/'+element.id" target="_blank">{{element.name}}</a>
              @if(today < element.competitionDate){
                  <span class="status-competition">
                      Pendiente
                  </span>
              }@else if(today >= element.competitionDate && today <= element.competitionEndDate){
                  <span class="status-competition in_course">En Curso</span>
              }@else {
                  <span class="status-competition finished">Finalizado</span>
              }
        </td>
      </ng-container>
  
    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef aria-label="row actions">&nbsp;</th>
      <td mat-cell *matCellDef="let element">
        <button
          matIconButton
          aria-label="expand row"
          (click)="toggle(element); $event.stopPropagation()"
          class="example-toggle-button"
          [class.example-toggle-button-expanded]="isExpanded(element)">
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </td>
    </ng-container>
  
    <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
        <div class="example-element-detail-wrapper"
          [class.example-element-detail-wrapper-expanded]="isExpanded(element)">
          <div class="example-element-detail">
            <competitions-markers-map-details [competition]="element"></competitions-markers-map-details>
          </div>
        </div>
      </td>
    </ng-container>
  
    <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
    <tr mat-row *matRowDef="let element; columns: columnsToDisplayWithExpand;"
        class="example-element-row"
        [class.example-expanded-row]="isExpanded(element)"
        (click)="toggle(element)">
    </tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
  </table>
</div>
