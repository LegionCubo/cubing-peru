@if(this.results().length > 0){
    <div class="table_conteiner">
        <table mat-table [dataSource]="dataSource" class="table mat-elevation-z8"  matSort (matSortChange)="announceSortChange($event)">
    
            <ng-container matColumnDef="nrPosition">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by nrPosition">
                #
                </th>
                <td mat-cell *matCellDef="let element"> {{ element.nrPosition }} </td>
            </ng-container>
    
            <ng-container matColumnDef="personName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by personName">
                NOMBRE
                </th>
                <td mat-cell *matCellDef="let element" class="name-person">
                    <a [href]="'https://www.worldcubeassociation.org/persons/'+element.personId" target="_blank">{{element.personName}}</a>
                </td>
            </ng-container>
    
            <ng-container matColumnDef="rankingSum">
                <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by competitionName">
                    TOTAL
                </th>
                <td mat-cell *matCellDef="let element">
                    {{element.rankingSum}}
                </td>
            </ng-container>

            @for (cat of categories(); track $index) {
                <ng-container [matColumnDef]="cat">
                    <th mat-header-cell *matHeaderCellDef [matTooltip]="cat | categoryWCA" matTooltipPosition="above">
                        <span [class]="'cubing-icon event-'+cat"></span>
                    </th>
                    <td mat-cell *matCellDef="let element" [matTooltip]="cat | categoryWCA" matTooltipPosition="above"
                    [class.top]="element.categories[cat].countryRank<=10" [class.noTop]="element.categories[cat].best==null">
                        {{element.categories[cat].countryRank}}
                    </td>
                </ng-container>
            }
    
    
            <!-- Filas -->
            <tr mat-header-row *matHeaderRowDef="columnsTable()"></tr>
            <tr mat-row *matRowDef="let row; columns: columnsTable();"></tr>
        </table>
    </div>

    <mat-paginator [pageSizeOptions]="[25, 50, 100]"
                    showFirstLastButtons
                    aria-label="Select page of periodic elements">
    </mat-paginator>
}
