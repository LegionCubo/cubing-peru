<header class="header" [class.open]="userService.menu()">
    <div class="header__content">
        <button class="btn__close" (click)="userToggleMenu()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z" fill="white"/></svg>
        </button>
        <div class="btns">
            <div class="logo">
                <a routerLink="/" class="logo__link" (click)="onClickLink()">
                    <img src="./icons/cubing_peru.svg" alt="Logo Cubing Peru" title="Cubing Peru Logo" width="55">
                </a>
            </div>

            @for(item of listMenu; track item.id){
                <button matFab 
                    [matTooltip]="item.name"
                    matTooltipPosition="right"
                    (click)="onClickBtnMenu(item)" [class.active]="itemSelected()?.id === item.id">
                    <img [src]="'./icons/'+item.icon+'.svg'" alt="" height="20">
                </button>
            }
        </div>

        
    </div>
    <div class="header__menu" [class.open]="closeMenu()">
        <span class="title font-primary">CUBING PERU</span>
        <nav class="nav">
            <span class="title__selected font-secondary">{{ itemSelected()?.name }}</span>
            <ul class="nav__menu">
                @for(links of itemSelected()?.children; track links.name){
                    <li class="nav__menu__link">
                        <a routerLink="{{links.route}}" routerLinkActive="active"  [routerLinkActiveOptions]="{ exact: true }" class="font-secondary" (click)="onClickLink()">
                            <img [src]="'./icons/'+links.icon+'.svg'" alt="" height="20">
                            <span>{{links.name}}</span>
                        </a>
                    </li>
                }
            </ul>
        </nav>
    </div>
</header>
